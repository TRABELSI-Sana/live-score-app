map $host $livefoot_root {
  livefoot.tn /usr/share/nginx/html-tn;
  default /usr/share/nginx/html-online;
}

map $host $livefoot_www_redirect_host {
  www.livefoot.tn livefoot.tn;
  default livefoot.online;
}

# --- HTTP: sert le challenge + redirige vers HTTPS ---
server {
  listen 80;
  server_name livefoot.online www.livefoot.online livefoot.tn www.livefoot.tn;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- Redirect www to non-www ---
server {
  listen 443 ssl;
  server_name www.livefoot.online www.livefoot.tn;

  ssl_certificate     /etc/letsencrypt/live/livefoot.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/livefoot.online/privkey.pem;

  return 301 https://$livefoot_www_redirect_host$request_uri;
}

# --- HTTPS ---
server {
  listen 443 ssl;
  server_name livefoot.online livefoot.tn;

  ssl_certificate     /etc/letsencrypt/live/livefoot.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/livefoot.online/privkey.pem;

  # Compression
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_min_length 256;
  gzip_vary on;

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # front (SPA)
  root $livefoot_root;
  index index.html;

  # Static assets (JS, CSS, images) — immutable cache (Vite hashes filenames)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # HTML pages — no-cache (crawlers always get fresh content)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # API
  location /api/ {
    proxy_pass http://backend:8099;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 3600s;

    # Prevent search engines from indexing API responses
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # ===== SITEMAP (1 endpoint, 2 fichiers selon le domaine) =====
  location = /sitemap.xml {
    default_type application/xml;

    # si domaine .tn -> sert /sitemap-tn.xml
    if ($host ~* (^|\.)livefoot\.tn$) {
      rewrite ^ /sitemap-tn.xml break;
    }

    # sinon -> sert /sitemap.xml
    try_files /sitemap.xml =404;
  }

  # (optionnel mais conseille) rendre le fichier .tn accessible si besoin direct
  location = /sitemap-tn.xml {
    default_type application/xml;
    try_files /sitemap-tn.xml =404;
  }

  # ===== ROBOTS =====
  location = /robots.txt {
    default_type text/plain;

    if ($host ~* (^|\.)livefoot\.tn$) {
      return 200 "User-agent: *\nAllow: /\nDisallow: /api/\n\nSitemap: https://livefoot.tn/sitemap.xml\n";
    }

    return 200 "User-agent: *\nAllow: /\nDisallow: /api/\n\nSitemap: https://livefoot.online/sitemap.xml\n";
  }
}
