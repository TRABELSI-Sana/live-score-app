name: Build, Push Docker Hub, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livefoot-production
  cancel-in-progress: false

jobs:
  build_push:
    name: Test, build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Test manual release commands
        run: python3 -B ops/test_deploy.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Read release version from Maven
        id: release
        working-directory: backend
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout -Dstyle.color=never)
          JAR_NAME=$(./mvnw help:evaluate -Dexpression=project.build.finalName -q -DforceStdout -Dstyle.color=never)
          if [[ "${VERSION^^}" == *SNAPSHOT* ]]; then
            echo 'Production requires a release version without SNAPSHOT in backend/pom.xml.' >&2
            exit 1
          fi
          [[ "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          [[ "$JAR_NAME" =~ ^[A-Za-z0-9_.-]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar_name=$JAR_NAME" >> "$GITHUB_OUTPUT"

      - name: Test and build backend
        working-directory: backend
        run: ./mvnw --batch-mode clean package

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npx puppeteer browsers install chrome
          npm run lint
          npm run build:seo
          npm run test:smoke

      - name: Prepare Docker build contexts
        env:
          JAR_NAME: ${{ steps.release.outputs.jar_name }}
        run: |
          cp "backend/target/$JAR_NAME.jar" backend/app.jar
          mkdir -p frontend-image/dist frontend-image/dist-tn
          cp -a frontend/dist/. frontend-image/dist/
          cp -a frontend/dist-tn/. frontend-image/dist-tn/

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check published release images
        id: registry
        run: |
          python3 - <<'PYTHON'
          import os
          import deploy
          release = deploy.version()
          values = {}
          for app in ("backend", "frontend"):
              values[app + "_exists"] = str(deploy.registry_image_matches_source(app, release)).lower()
              values[app + "_source"] = deploy.fingerprint(app)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PYTHON

      - name: Build and push backend
        if: steps.registry.outputs.backend_exists != 'true'
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/trabelsislim/live-score-backend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.livefoot.source.sha256=${{ steps.registry.outputs.backend_source }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        if: steps.registry.outputs.frontend_exists != 'true'
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend-image
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/trabelsislim/live-score-frontend:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.livefoot.source.sha256=${{ steps.registry.outputs.frontend_source }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


  deploy:
    name: Deploy published images to K3s
    needs: build_push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS: ubuntu@51.210.246.121
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" && test -n "$VPS_HOST_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Prepare versioned Kubernetes manifests
        run: |
          python3 - <<'PYTHON'
          import shutil
          from pathlib import Path
          import deploy
          deploy.render_deployment(deploy.version())
          Path("rendered").mkdir()
          for path in Path("k8s").glob("*.yaml"):
              shutil.copy2(path, Path("rendered") / path.name)
          PYTHON

      - name: Apply manifests and wait for deployments
        run: |
          ssh "$VPS" 'mkdir -p /home/ubuntu/apps/live-score-k8s/manifests'
          scp rendered/*.yaml "$VPS:/home/ubuntu/apps/live-score-k8s/manifests/"
          scp ops/reload-nginx-after-cert-renewal.sh "$VPS:/home/ubuntu/apps/live-score-k8s/"
          ssh "$VPS" 'sudo k3s kubectl apply -f /home/ubuntu/apps/live-score-k8s/manifests/configmap.yaml'
          ssh "$VPS" 'bash -se' <<'REMOTE'
          cd /home/ubuntu/apps/live-score-k8s
          k() { sudo k3s kubectl "$@"; }
          k apply --dry-run=server -f manifests/
          k apply -f manifests/pvc.yaml
          k apply -f manifests/service.yaml
          k apply -f manifests/deployment.yaml
          for app in redis ollama backend frontend edge; do
            k -n live-score rollout status "deployment/$app" --timeout=300s
          done
          k apply -f manifests/cronjob.yaml
          sudo install -m 755 reload-nginx-after-cert-renewal.sh /etc/letsencrypt/renewal-hooks/deploy/reload-livefoot-nginx
          for domain in livefoot.online livefoot.tn; do
            curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "https://$domain/healthz"
            curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "https://$domain/api/stream/board" -o /dev/null
          done
          REMOTE
