name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw -DskipTests clean package

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (with SEO prerendering)
        run: |
          cd frontend
          npm ci
          npx puppeteer browsers install chrome
          npm run build:seo

      - name: Prepare frontend-image
        run: |
          rm -rf frontend-image/dist frontend-image/dist-tn
          mkdir -p frontend-image/dist
          rsync -a --delete frontend/dist/ frontend-image/dist/
          mkdir -p frontend-image/dist-tn
          rsync -a --delete frontend/dist-tn/ frontend-image/dist-tn/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_USER: ubuntu
          VPS_HOST: 51.210.246.121
          REMOTE_DIR: /home/ubuntu/apps/live-scores
        run: |
          JAR_PATH=$(ls -1 backend/target/*-SNAPSHOT.jar | head -n 1)

          ssh ${VPS_USER}@${VPS_HOST} "mkdir -p ${REMOTE_DIR}/{backend,frontend-image,nginx,certbot/www,certbot/conf,ops}"

          rsync -az "${JAR_PATH}" ${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/backend/app.jar
          rsync -az backend/Dockerfile ${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/backend/
          rsync -az --delete frontend-image/ ${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/frontend-image/
          rsync -az docker-compose.yml ${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/
          rsync -az nginx/ ${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/nginx/
          rsync -az ops/ ${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/ops/

          ssh ${VPS_USER}@${VPS_HOST} "cd ${REMOTE_DIR} && docker compose up -d --build"
          ssh ${VPS_USER}@${VPS_HOST} "sudo install -m 755 ${REMOTE_DIR}/ops/reload-nginx-after-cert-renewal.sh /etc/letsencrypt/renewal-hooks/deploy/reload-livefoot-nginx"
