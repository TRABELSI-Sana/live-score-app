spring.application.name=live-scores
server.port=8099
management.endpoints.web.exposure.include=health,info,metrics
apifootball.base-url=https://v3.football.api-sports.io
apifootball.key=${APIFOOTBALL_KEY}
apifootball.quota-per-day=7500
apifootball.competition-ids=1,186,233,202,305,308,200,61,78,135,39,17,12,2,140
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://ollama:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.chat.options.keep-alive=30m
spring.ai.ollama.chat.options.num-ctx=2048
spring.ai.ollama.chat.options.num-predict=160
spring.ai.ollama.chat.options.temperature=0.1
#apifootball.competition-ids=2,5,97,162,163,160,167,169,77,179,178,182,333,334,227,244,42,343,427,19,223,245,446,224,243,242,1,4,38,36,35,313,305,287,281
app.ai.timeout-seconds=${APP_AI_TIMEOUT_SECONDS:25}
app.ai.max-concurrent-requests=${APP_AI_MAX_CONCURRENT_REQUESTS:1}

app.ai.cache-seconds=${APP_AI_CACHE_SECONDS:60}
