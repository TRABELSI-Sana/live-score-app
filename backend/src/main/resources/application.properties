spring.application.name=live-scores
server.port=8099
management.endpoints.web.exposure.include=health,info,metrics

# SofaScore provider
sofascore.base-url=https://api.sofascore.com
# tournament ids to track for fixtures/live board
sofascore.tournaments=1,17,35,36,38,42,223,305,313
# format: <tournamentId>:<seasonId>
sofascore.standings-mapping=36:77559

livescore.quota-per-day=14500
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://ollama:11434}
spring.ai.ollama.chat.options.model=mistral

app.ai.timeout-seconds=${APP_AI_TIMEOUT_SECONDS:420}
app.ai.max-concurrent-requests=${APP_AI_MAX_CONCURRENT_REQUESTS:10}
