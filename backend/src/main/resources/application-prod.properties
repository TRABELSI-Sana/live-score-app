spring.application.name=live-scores
server.port=8099
management.endpoints.web.exposure.include=health,info,metrics

sofascore.base-url=https://api.sofascore.com
sofascore.tournaments=${SOFASCORE_TOURNAMENTS:1,17,35,36,38,42,223,305,313}
sofascore.standings-mapping=${SOFASCORE_STANDINGS_MAPPING:36:77559}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT}
livescore.quota-per-day=14500
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://ollama:11434}
spring.ai.ollama.chat.options.model=mistral

app.ai.timeout-seconds=${APP_AI_TIMEOUT_SECONDS:8}
app.ai.max-concurrent-requests=${APP_AI_MAX_CONCURRENT_REQUESTS:1}
