services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - APP_AI_TIMEOUT_SECONDS=120
      - APP_AI_MAX_CONCURRENT_REQUESTS=1
      - APIFOOTBALL_KEY=${APIFOOTBALL_KEY:-81c9d306d8d84c8c22cbd42a154a996a}
    depends_on:
      - redis

  web:
    build: ./frontend-image
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
