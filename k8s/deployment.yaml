---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: live-score
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: edge
  template:
    metadata:
      labels:
        app: edge
      annotations:
        livefoot.io/config-version: "${CONFIG_VERSION}"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: nginx
        image: nginx:stable-alpine
        ports:
        - containerPort: 80
          hostPort: 80
        - containerPort: 443
          hostPort: 443
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: nginx
          mountPath: "/etc/nginx/conf.d"
          readOnly: true
        - name: certificates
          mountPath: "/etc/letsencrypt"
          readOnly: true
        - name: acme
          mountPath: "/var/www/certbot"
          readOnly: true
        imagePullPolicy: IfNotPresent
      volumes:
      - name: nginx
        configMap:
          name: edge-nginx
      - name: certificates
        hostPath:
          path: "/etc/letsencrypt"
          type: Directory
      - name: acme
        hostPath:
          path: "/home/ubuntu/apps/live-scores/certbot/www"
          type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: live-score
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama@sha256:5f7a20da9b4d42d1909b4693f90942135bcabc335ee42d529c0d143c44a92311
        imagePullPolicy: IfNotPresent
        env:
        - name: OLLAMA_NUM_PARALLEL
          value: '1'
        - name: OLLAMA_MAX_QUEUE
          value: '2'
        - name: OLLAMA_KEEP_ALIVE
          value: 5m
        - name: OLLAMA_CONTEXT_LENGTH
          value: '2048'
        - name: OLLAMA_MAX_LOADED_MODELS
          value: '1'
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '6'
            memory: 8Gi
        readinessProbe:
          tcpSocket:
            port: 11434
        volumeMounts:
        - name: data
          mountPath: "/root/.ollama"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ollama-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: live-score
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        livefoot.io/config-version: "${CONFIG_VERSION}"
    spec:
      containers:
      - name: frontend
        image: "${FRONTEND_IMAGE}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: 80
        volumeMounts:
        - name: nginx
          mountPath: "/etc/nginx/conf.d"
          readOnly: true
      volumes:
      - name: nginx
        configMap:
          name: frontend-nginx
      imagePullSecrets:
      - name: ghcr-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: live-score
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        livefoot.io/config-version: "${CONFIG_VERSION}"
    spec:
      containers:
      - name: backend
        image: "${BACKEND_IMAGE}"
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: api-football
        ports:
        - containerPort: 8099
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '2'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: "/actuator/health"
            port: 8099
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: "/actuator/health"
            port: 8099
        livenessProbe:
          tcpSocket:
            port: 8099
          periodSeconds: 15
      imagePullSecrets:
      - name: ghcr-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: live-score
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        args:
        - redis-server
        - "--appendonly"
        - 'no'
        - "--save"
        - '60'
        - '1'
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
        volumeMounts:
        - name: data
          mountPath: "/data"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
